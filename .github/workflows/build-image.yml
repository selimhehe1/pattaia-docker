name: Build PattaIA ComfyUI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/build-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (essential for 12 GB image)
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /opt/google /usr/local/share/boost
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          docker system prune -af >/dev/null 2>&1 || true
          echo "=== After cleanup ==="
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          push: true
          tags: |
            ghcr.io/selimhehe1/pattaia-comfyui:v1
            ghcr.io/selimhehe1/pattaia-comfyui:latest
          cache-from: type=registry,ref=ghcr.io/selimhehe1/pattaia-comfyui:buildcache
          cache-to: type=registry,ref=ghcr.io/selimhehe1/pattaia-comfyui:buildcache,mode=max
